services:
  maas-parser:
    build: .
    container_name: maas-parser
    ports:
      - "8899:5000"
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123...
      - SECRET_KEY=change-this-to-a-random-string
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./server_data.db:/app/server_data.db
      - ./name-apikey-mapping.csv:/app/name-apikey-mapping.csv
    restart: unless-stopped
