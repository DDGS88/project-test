<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaaS 消费解析 - 登录</title>
<style>
  * {margin:0;padding:0;box-sizing:border-box;}
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f0f2f5;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  .login-card {
    background:#fff;
    border-radius:16px;
    padding:40px 36px;
    width:380px;
    max-width:90vw;
    box-shadow:0 4px 24px rgba(0,0,0,.08);
    border:1px solid #e5e7eb;
  }
  .login-card h1 {
    font-size:22px;margin-bottom:4px;text-align:center;
  }
  .login-card .sub {
    font-size:13px;color:#888;text-align:center;margin-bottom:28px;
  }
  .form-group {margin-bottom:18px;}
  .form-group label {
    display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px;
  }
  .form-group input {
    width:100%;padding:10px 14px;border:1px solid #d1d5db;
    border-radius:8px;font-size:14px;outline:none;transition:border .2s;
  }
  .form-group input:focus {border-color:#4f6ef7;box-shadow:0 0 0 3px rgba(79,110,247,.1);}
  .btn {
    width:100%;padding:11px;background:#4f6ef7;color:#fff;
    border:none;border-radius:8px;font-size:15px;font-weight:600;
    cursor:pointer;transition:opacity .2s;
  }
  .btn:hover {opacity:.9;}
  .btn:disabled {opacity:.5;cursor:not-allowed;}
  .error {
    color:#ef4444;font-size:13px;text-align:center;margin-top:12px;
    display:none;
  }
  .error.show {display:block;}
</style>
</head>
<body>

<div class="login-card">
  <h1>MaaS 消费解析</h1>
  <p class="sub">请登录以继续</p>
  <form id="loginForm">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="输入用户名" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="输入密码" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="btnLogin">登 录</button>
    <p class="error" id="errorMsg">用户名或密码错误</p>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('errorMsg');
const btn = document.getElementById('btnLogin');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    }).then(r => r.json());

    if (res.ok) {
      window.location.href = '/';
    } else {
      errorEl.textContent = res.error || '登录失败';
      errorEl.classList.add('show');
    }
  } catch {
    errorEl.textContent = '网络错误，请重试';
    errorEl.classList.add('show');
  }

  btn.disabled = false;
  btn.textContent = '登 录';
});
</script>
</body>
</html>
