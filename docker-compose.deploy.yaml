# ── tt-inspector 部署用 docker-compose ──
# 放在目标服务器 /opt/tt-inspector/ 目录下
# GitHub Actions 部署时会自动拉取最新镜像并重启

services:
  tt-inspector:
    image: ${IMAGE}:${TAG}
    container_name: tt-inspector
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    depends_on:
      - veridrop
    networks:
      - tt-network

  # 中转站检测服务：不对外暴露端口，只被 tt-inspector 反向代理到 /veridrop 下
  veridrop:
    image: veridrop:${TAG}
    container_name: veridrop
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 检测报告落盘目录：容器重建后历史记录与报告不丢
      - ./veridrop-data:/app/data
    networks:
      - tt-network

networks:
  tt-network:
    driver: bridge
