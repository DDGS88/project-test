server:
  port: 9200
  read_timeout: 30s
  write_timeout: 30s

# 业务数据库（渠道 / 模型查询）
database:
  driver: "mysql"                   # mysql 或 postgres
  dsn: "tt_inspect:tt_inspect...@tcp(10.0.1.14:3306)/new_api?parseTime=true"
  max_open_conns: 10
  max_idle_conns: 5

# 告警平台数据库（告警规则存储 + 日志查询）
log_database:
  driver: "postgres"
  dsn: "postgresql://root:TokenTurbo%40PSQL1@10.0.0.15:5432/new_api"
  max_open_conns: 10
  max_idle_conns: 5

engine:
  poll_interval: 30s
  rule_reload_interval: 60s
  default_window_sec: 300
  default_cooldown_sec: 600
  checkpoint_file: "checkpoint.json"

logging:
  level: "info"
  format: "json"

auth:
  jwt_secret: "tt-inspector-jwt-secret-change-me"   # 生产环境请更换
  admin_password: "AIGateway@2026!Admin"              # 生产环境请更换

# 中转站检测（veridrop）：与 tt-inspector 同属 tt-network，按 compose 服务名访问
veridrop:
  enabled: true
  upstream: "http://veridrop:8000"

# 渠道探测：可用性探测 + 质量探测（veridrop 真伪检测）
# 这里只是首次启动/重置时的默认值，实际参数在控制台「渠道探测」页面调整并落库
probe:
  avail_default_cron: "0 */6 * * *"
  quality_default_cron: "0 4 * * *"
  timeout_sec: 15
  concurrency: 5
  quality_timeout_sec: 300
  quality_score_threshold: 60
  cooldown_sec: 1800