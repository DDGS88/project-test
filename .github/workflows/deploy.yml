name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          echo "ENV=prod" >> $GITHUB_OUTPUT
          echo "TAG=prod-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Select environment config
        run: |
          echo "Using config/config.${{ steps.env.outputs.ENV }}.yaml"
          cp config/config.${{ steps.env.outputs.ENV }}.yaml config/config.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t tt-inspector:${{ steps.env.outputs.TAG }} .
          docker build -t veridrop:${{ steps.env.outputs.TAG }} -f veridrop/Dockerfile veridrop/

      - name: Save image as tar
        run: |
          docker save -o images.tar \
            tt-inspector:${{ steps.env.outputs.TAG }} \
            veridrop:${{ steps.env.outputs.TAG }}
          sudo chmod 644 images.tar

      # ── 部署到生产服务器（main 分支） ──

      - name: Copy image to Prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.128.87.71
          port: 22
          username: root
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "images.tar"
          target: "/opt/tt-inspector/"

      - name: Deploy to Prod server
        uses: appleboy/ssh-action@v1
        with:
          host: 43.128.87.71
          port: 22
          username: root
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/tt-inspector/data /opt/tt-inspector/veridrop-data
            docker load -i /opt/tt-inspector/images.tar
            cat > /opt/tt-inspector/docker-compose.deploy.yaml << 'COMPOSE_EOF'
            services:
              tt-inspector:
                image: tt-inspector:${{ steps.env.outputs.TAG }}
                container_name: tt-inspector
                restart: unless-stopped
                ports:
                  - "9200:9200"
                environment:
                  TZ: Asia/Shanghai
                volumes:
                  - ./data:/app/data
                depends_on:
                  - veridrop
                networks:
                  - tt-network

              # 中转站检测服务：不对外暴露端口，只被 tt-inspector 反向代理到 /veridrop 下
              veridrop:
                image: veridrop:${{ steps.env.outputs.TAG }}
                container_name: veridrop
                restart: unless-stopped
                environment:
                  TZ: Asia/Shanghai
                volumes:
                  - ./veridrop-data:/app/data
                networks:
                  - tt-network

            networks:
              tt-network:
                driver: bridge
            COMPOSE_EOF
            cd /opt/tt-inspector
            docker compose -f docker-compose.deploy.yaml up -d --remove-orphans
            docker image prune -f
